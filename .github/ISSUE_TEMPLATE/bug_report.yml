name: Bug report
description: Report a reproducibility, simulator, or analysis problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, configuration, and smallest reproducible input.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, compiler, Python version, and dependency versions.
